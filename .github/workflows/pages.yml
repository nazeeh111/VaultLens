name: Publish synthetic report
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vaultlens-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - run: go test ./...
      - run: mkdir _site && go run . --input testdata/synthetic.json --out _site/index.html --as-of 2026-09-23
      - name: Label the public fixture report
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          page = Path('_site/index.html')
          html = page.read_text()
          assert html.count('<body>') == 1
          banner = Path('docs/demo-banner.html').read_text()
          page.write_text(html.replace('<body>', '<body>' + banner, 1))
          PYTHON
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
