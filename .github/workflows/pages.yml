name: Publish synthetic report
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vaultlens-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false
      - run: go test ./...
      - run: mkdir _site && go run . --input testdata/synthetic.json --out _site/index.html --as-of 2026-09-23
      - name: Label the public fixture report
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          page = Path('_site/index.html')
          html = page.read_text()
          assert html.count('<body>') == 1
          banner = Path('docs/demo-banner.html').read_text()
          page.write_text(html.replace('<body>', '<body>' + banner, 1))
          PYTHON
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          include-hidden-files: true
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
